<!doctype html>
<html class="scroll-smooth" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CampusHustle — Learn. Teach. Earn. The premium academic marketplace for university students."
    />
    <title>CampusHustle - Learn. Teach. Earn.</title>
    <meta name="theme-color" content="#0a0a0c" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('campus-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.classList.add(stored)
            return
          }
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.add(dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body class="bg-ink-950 text-ink-100 font-body antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
