name: CampusHustle Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Continuous Integration (CI): Lint, Automated Tests & Vite Build
  # =========================================================================
  ci:
    name: CI Checks (Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Test Suite (Vitest)
        run: npm test

      - name: Build Production Bundle (Vite)
        run: npm run build

  # =========================================================================
  # 2. Continuous Deployment (CD): Production Deployment (Vercel / Netlify)
  # =========================================================================
  cd:
    name: CD Deployment (Production)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Frontend Production Deployment (Vercel / Netlify)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          DEPLOY_URL="${VERCEL_DEPLOY_HOOK:-$NETLIFY_DEPLOY_HOOK}"
          if [ -n "$DEPLOY_URL" ]; then
            echo "Triggering frontend deployment..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$DEPLOY_URL")
            HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Frontend deployment triggered successfully (HTTP $HTTP_STATUS)."
            else
              echo "Deployment trigger failed with status $HTTP_STATUS: $HTTP_BODY"
              exit 1
            fi
          else
            echo "::warning ::Neither VERCEL_DEPLOY_HOOK_URL nor NETLIFY_BUILD_HOOK_URL is configured in GitHub repository secrets. Skipping remote webhook trigger."
          fi
